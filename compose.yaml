services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hims
      POSTGRES_USER: hims
      POSTGRES_PASSWORD: hims
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hims"]
      interval: 5s
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
  worker:
    build: ./backend
    command: celery -A config worker -l info
    env_file: .env
    depends_on: [db, redis]
    volumes:
      - ./backend:/app
  beat:
    build: ./backend
    command: celery -A config beat -l info
    env_file: .env
    depends_on: [db, redis]
    volumes:
      - ./backend:/app
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on: [backend]
    volumes:
      - ./frontend:/app
      - /app/node_modules
volumes:
  pgdata:
