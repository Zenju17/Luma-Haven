services:
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    env_file: .env
    depends_on: [redis]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
  worker:
    build: ./backend
    command: celery -A config worker -l info
    env_file: .env
    depends_on: [redis]
    volumes:
      - ./backend:/app
  beat:
    build: ./backend
    command: celery -A config beat -l info
    env_file: .env
    depends_on: [redis]
    volumes:
      - ./backend:/app
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on: [backend]
    volumes:
      - ./frontend:/app
      - /app/node_modules
