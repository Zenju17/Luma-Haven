services:
  redis:
    image: docker.io/library/redis:7-alpine
  backend:
    build: ./backend
    env_file: .env
    depends_on: [redis]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:z
  worker:
    build: ./backend
    command: celery -A config worker -l info
    env_file: .env
    depends_on: [redis]
    volumes:
      - ./backend:/app:z
  beat:
    build: ./backend
    command: celery -A config beat -l info
    env_file: .env
    depends_on: [redis]
    volumes:
      - ./backend:/app:z
  frontend:
    build: ./frontend
    environment:
      - API_PROXY_TARGET=http://backend:8000
    ports:
      - "5173:5173"
    depends_on: [backend]
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
