<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <linearGradient id="terraceDusk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142825" />
      <stop offset="40%" stop-color="#243d38" />
      <stop offset="75%" stop-color="#544c3c" />
      <stop offset="100%" stop-color="#735d3d" />
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebd09c" />
      <stop offset="50%" stop-color="#b89758" />
      <stop offset="100%" stop-color="#7a5f2a" />
    </linearGradient>
    <radialGradient id="lantern" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5dd" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#d9b87f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#142825" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Twilight Sky -->
  <rect width="960" height="600" fill="url(#terraceDusk)" />

  <!-- City Skyline Silhouette at Twilight -->
  <g fill="#0e1f1c" opacity="0.9">
    <rect x="60" y="240" width="40" height="200" />
    <rect x="130" y="200" width="55" height="240" />
    <polygon points="157,170 145,200 170,200" />
    <rect x="220" y="260" width="35" height="180" />
    <rect x="680" y="230" width="50" height="210" />
    <rect x="760" y="190" width="45" height="250" />
    <rect x="830" y="250" width="40" height="190" />
  </g>

  <!-- Terrace Floor & Brass Railing -->
  <rect x="0" y="380" width="960" height="220" fill="#182b27" />
  <line x1="0" y1="380" x2="960" y2="380" stroke="url(#brass)" stroke-width="3" />
  <!-- Balustrade Picketers -->
  <g stroke="url(#brass)" stroke-width="1.5" opacity="0.7">
    <line x1="100" y1="380" x2="100" y2="440" />
    <line x1="200" y1="380" x2="200" y2="440" />
    <line x1="300" y1="380" x2="300" y2="440" />
    <line x1="400" y1="380" x2="400" y2="440" />
    <line x1="500" y1="380" x2="500" y2="440" />
    <line x1="600" y1="380" x2="600" y2="440" />
    <line x1="700" y1="380" x2="700" y2="440" />
    <line x1="800" y1="380" x2="800" y2="440" />
  </g>

  <!-- Potted Bamboo & Tropical Plants on Terrace -->
  <g transform="translate(120, 290)">
    <rect x="10" y="70" width="40" height="50" rx="4" fill="#2d2218" stroke="rgba(184,151,88,0.4)" stroke-width="1" />
    <path d="M30 70 L30 0 M20 70 L10 15 M40 70 L50 20" stroke="#255e52" stroke-width="3" />
  </g>
  <g transform="translate(780, 290)">
    <rect x="10" y="70" width="40" height="50" rx="4" fill="#2d2218" stroke="rgba(184,151,88,0.4)" stroke-width="1" />
    <path d="M30 70 L30 0 M20 70 L10 15 M40 70 L50 20" stroke="#255e52" stroke-width="3" />
  </g>

  <!-- Lanterns on Table with Warm Candlelight Glow -->
  <circle cx="480" cy="430" r="120" fill="url(#lantern)" />
  <!-- Low Rattan Table & Loungers -->
  <ellipse cx="480" cy="460" rx="70" ry="18" fill="#281d16" stroke="rgba(184,151,88,0.4)" stroke-width="1" />
  <rect x="473" y="420" width="14" height="24" rx="2" fill="none" stroke="url(#brass)" stroke-width="1.5" />
  <circle cx="480" cy="432" r="4" fill="#fff7e0" />

  <!-- Caption Plaque Overlay -->
  <g transform="translate(480, 560)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="rgba(12,38,34,0.85)" stroke="url(#brass)" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" fill="#f4f7f5" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" letter-spacing="1">SHADED ROOFTOP TERRACE · DUSK</text>
  </g>
</svg>
