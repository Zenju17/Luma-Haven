<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4e5df" />
      <stop offset="100%" stop-color="#edf5f2" />
    </linearGradient>
    <linearGradient id="cyBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebd09c" />
      <stop offset="50%" stop-color="#b89758" />
      <stop offset="100%" stop-color="#7a5f2a" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#194740" />
      <stop offset="100%" stop-color="#0c2420" />
    </linearGradient>
  </defs>

  <!-- Open Sky Courtyard -->
  <rect width="960" height="600" fill="url(#cySky)" />

  <!-- Surrounding Hotel Walls with Colonnade / Arches -->
  <path d="M0 240 L300 280 V600 H0 Z" fill="#e8ebe8" stroke="#cbdad4" stroke-width="1.5" />
  <path d="M960 240 L660 280 V600 H960 Z" fill="#e8ebe8" stroke="#cbdad4" stroke-width="1.5" />
  <!-- Center Open Air Terrace Wall -->
  <rect x="300" y="220" width="360" height="380" fill="#f4f7f5" stroke="#cbdad4" stroke-width="1" />

  <!-- Arches along the walkway -->
  <path d="M60 600 V380 C60 340 100 320 140 320 C180 320 220 340 220 380 V600 Z" fill="#143c36" />
  <path d="M740 600 V380 C740 340 780 320 820 320 C860 320 900 340 900 380 V600 Z" fill="#143c36" />

  <!-- Tropical Fronds / Trees framing courtyard -->
  <!-- Left Palm -->
  <path d="M120 400 Q80 200 20 160 Q120 220 160 340 Z" fill="#1c4e43" />
  <path d="M140 400 Q150 160 240 100 Q180 200 160 360 Z" fill="#256456" />
  <!-- Right Palm -->
  <path d="M820 400 Q850 180 920 140 Q820 220 780 360 Z" fill="#1c4e43" />
  <path d="M800 400 Q760 160 700 90 Q740 200 780 360 Z" fill="#256456" />

  <!-- Center Reflection Pool -->
  <ellipse cx="480" cy="460" rx="220" ry="80" fill="url(#waterGrad)" stroke="url(#cyBrass)" stroke-width="2" />
  <ellipse cx="480" cy="455" rx="200" ry="70" fill="#153d37" opacity="0.8" />
  <circle cx="480" cy="450" r="14" fill="url(#cyBrass)" />

  <!-- Subtle Water Ripples -->
  <ellipse cx="480" cy="455" rx="120" ry="35" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <ellipse cx="480" cy="455" rx="60" ry="18" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />

  <!-- Dappled Sunlight -->
  <circle cx="380" cy="360" r="40" fill="#fffbe8" opacity="0.25" />
  <circle cx="560" cy="380" r="30" fill="#fffbe8" opacity="0.2" />

  <!-- Caption Plaque Overlay -->
  <g transform="translate(480, 560)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="rgba(12,38,34,0.85)" stroke="url(#cyBrass)" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" fill="#f4f7f5" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" letter-spacing="1">CENTRAL COURTYARD · MORNING</text>
  </g>
</svg>
