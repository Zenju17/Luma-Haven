<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ctLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123530" />
      <stop offset="100%" stop-color="#0a1d1a" />
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebd09c" />
      <stop offset="50%" stop-color="#b89758" />
      <stop offset="100%" stop-color="#7a5f2a" />
    </linearGradient>
  </defs>

  <rect width="960" height="600" fill="url(#ctLightBg)" />

  <!-- Morning Sunrise Sunlight Streaming Through Blinds -->
  <g opacity="0.12">
    <polygon points="550,50 900,50 400,600 0,600" fill="#fffbe8" />
    <polygon points="620,50 960,50 480,600 80,600" fill="#fffbe8" />
  </g>

  <!-- Large City Vista Window -->
  <g transform="translate(620, 60)">
    <rect width="260" height="380" rx="6" fill="#0d2420" stroke="rgba(184,151,88,0.3)" stroke-width="2" />
    <!-- City Rooftops & Greenery -->
    <rect x="30" y="200" width="45" height="180" fill="#173e36" />
    <rect x="90" y="160" width="55" height="220" fill="#1b473f" />
    <rect x="160" y="220" width="40" height="160" fill="#143731" />
  </g>

  <!-- Solid Oak Work Desk & Leather Chair -->
  <g transform="translate(140, 260)">
    <!-- Desk Surface -->
    <rect x="0" y="60" width="380" height="18" rx="3" fill="#2c2018" stroke="rgba(184,151,88,0.3)" stroke-width="1" />
    <line x1="40" y1="78" x2="30" y2="240" stroke="#1c140e" stroke-width="5" />
    <line x1="340" y1="78" x2="350" y2="240" stroke="#1c140e" stroke-width="5" />

    <!-- Ceramic Cup & Open Notebook -->
    <rect x="180" y="35" width="60" height="25" rx="2" fill="#f4f7f5" stroke="#cbdad4" stroke-width="1" />
    <ellipse cx="140" cy="45" rx="10" ry="7" fill="#d9b87f" />

    <!-- Minimalist Desk Lamp -->
    <path d="M70 60 L70 0 L110 0" fill="none" stroke="url(#brass)" stroke-width="3" />
    <path d="M100 -5 L120 5 L105 10 Z" fill="url(#brass)" />
    <circle cx="112" cy="15" r="20" fill="#fffbe8" opacity="0.4" />
  </g>

  <!-- Caption Plaque Overlay -->
  <g transform="translate(480, 560)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="rgba(12,38,34,0.85)" stroke="url(#brass)" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" fill="#f4f7f5" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" letter-spacing="1">CITY TWIN · MORNING WORKSPACE</text>
  </g>
</svg>
