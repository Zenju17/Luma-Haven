<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gkIntBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143933" />
      <stop offset="100%" stop-color="#0a1e1b" />
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebd09c" />
      <stop offset="50%" stop-color="#b89758" />
      <stop offset="100%" stop-color="#7a5f2a" />
    </linearGradient>
  </defs>

  <rect width="960" height="600" fill="url(#gkIntBg)" />

  <!-- Morning Sunlight coming through Garden French Doors -->
  <polygon points="120,40 380,40 680,600 0,600" fill="#faebd7" opacity="0.09" />

  <!-- Garden Doors (Left) -->
  <g transform="translate(80, 40)">
    <rect width="240" height="480" rx="4" fill="#0d2420" stroke="rgba(184,151,88,0.3)" stroke-width="2" />
    <path d="M40 480 Q80 300 140 240 Q180 320 200 480 Z" fill="#1d554a" opacity="0.7" />
    <circle cx="120" cy="180" r="60" fill="#fffbe8" opacity="0.1" />
  </g>

  <!-- Plush Garden King Bed (Right) -->
  <g transform="translate(380, 160)">
    <!-- Timber Headboard -->
    <rect width="520" height="300" rx="6" fill="#201712" stroke="rgba(184,151,88,0.2)" stroke-width="1.5" />
    <!-- White Pillows -->
    <rect x="30" y="80" width="200" height="70" rx="10" fill="#ffffff" stroke="#cbdad4" stroke-width="1" />
    <rect x="270" y="80" width="200" height="70" rx="10" fill="#ffffff" stroke="#cbdad4" stroke-width="1" />
    <!-- Crisp White Duvet -->
    <rect x="10" y="150" width="480" height="260" fill="#fcfdfd" />
    <!-- Forest Green Linen Runner -->
    <rect x="10" y="280" width="480" height="110" fill="#1c4840" />
    <line x1="10" y1="280" x2="490" y2="280" stroke="url(#brass)" stroke-width="2" />
  </g>

  <!-- Brass Bedside Sconce -->
  <circle cx="640" cy="90" r="14" fill="url(#brass)" />
  <line x1="640" y1="90" x2="640" y2="120" stroke="url(#brass)" stroke-width="2.5" />
  <circle cx="640" cy="125" r="28" fill="#fef6e0" opacity="0.4" />

  <!-- Caption Plaque Overlay -->
  <g transform="translate(480, 560)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="rgba(12,38,34,0.85)" stroke="url(#brass)" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" fill="#f4f7f5" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" letter-spacing="1">GARDEN KING · BEDROOM RETREAT</text>
  </g>
</svg>
