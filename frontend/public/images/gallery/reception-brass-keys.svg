<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <linearGradient id="recBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2522" />
      <stop offset="100%" stop-color="#061614" />
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebd09c" />
      <stop offset="50%" stop-color="#b89758" />
      <stop offset="100%" stop-color="#7a5f2a" />
    </linearGradient>
    <radialGradient id="deskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faecc8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0c2522" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="960" height="600" fill="url(#recBg)" />

  <!-- Back Wall Teak Pigeonhole Key Rack (Traditional physical brass keys) -->
  <g transform="translate(180, 60)">
    <rect width="600" height="240" rx="4" fill="#1b130e" stroke="rgba(184,151,88,0.3)" stroke-width="2" />
    <!-- Grid of Key Boxes: 3 rows of 6 -->
    <!-- Row 1 -->
    <g fill="#100b07" stroke="rgba(184,151,88,0.2)" stroke-width="1">
      <rect x="20" y="20" width="80" height="55" />
      <rect x="115" y="20" width="80" height="55" />
      <rect x="210" y="20" width="80" height="55" />
      <rect x="305" y="20" width="80" height="55" />
      <rect x="400" y="20" width="80" height="55" />
      <rect x="495" y="20" width="80" height="55" />

      <!-- Row 2 -->
      <rect x="20" y="90" width="80" height="55" />
      <rect x="115" y="90" width="80" height="55" />
      <rect x="210" y="90" width="80" height="55" />
      <rect x="305" y="90" width="80" height="55" />
      <rect x="400" y="90" width="80" height="55" />
      <rect x="495" y="90" width="80" height="55" />

      <!-- Row 3 -->
      <rect x="20" y="160" width="80" height="55" />
      <rect x="115" y="160" width="80" height="55" />
      <rect x="210" y="160" width="80" height="55" />
      <rect x="305" y="160" width="80" height="55" />
      <rect x="400" y="160" width="80" height="55" />
      <rect x="495" y="160" width="80" height="55" />
    </g>

    <!-- Hanging Brass Keys in Boxes -->
    <g fill="url(#brass)">
      <!-- Key 101 -->
      <circle cx="60" cy="38" r="6" />
      <rect x="58" y="44" width="4" height="18" />
      <rect x="62" y="54" width="6" height="3" />
      <text x="60" y="32" fill="#d9b87f" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">101</text>

      <!-- Key 102 -->
      <circle cx="155" cy="38" r="6" />
      <rect x="153" y="44" width="4" height="18" />
      <rect x="157" y="54" width="6" height="3" />
      <text x="155" y="32" fill="#d9b87f" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">102</text>

      <!-- Key 201 -->
      <circle cx="250" cy="108" r="6" />
      <rect x="248" y="114" width="4" height="18" />
      <rect x="252" y="124" width="6" height="3" />
      <text x="250" y="102" fill="#d9b87f" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">201</text>

      <!-- Key 301 -->
      <circle cx="440" cy="178" r="6" />
      <rect x="438" y="184" width="4" height="18" />
      <rect x="442" y="194" width="6" height="3" />
      <text x="440" y="172" fill="#d9b87f" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">301</text>
    </g>
  </g>

  <!-- Front Desk Glow -->
  <circle cx="480" cy="420" r="280" fill="url(#deskGlow)" />

  <!-- Handcrafted Solid Teak Reception Counter -->
  <path d="M60 420 L900 420 L840 600 H120 Z" fill="#201711" stroke="rgba(184,151,88,0.4)" stroke-width="2" />
  <line x1="60" y1="420" x2="900" y2="420" stroke="url(#brass)" stroke-width="4" />

  <!-- Brass Bell & Guest Ledger on Counter -->
  <g transform="translate(480, 395)">
    <!-- Service Bell -->
    <path d="M-15 15 C-15 5 15 5 15 15 Z" fill="url(#brass)" />
    <circle cx="0" cy="2" r="3" fill="url(#brass)" />
    <rect x="-20" y="15" width="40" height="4" rx="2" fill="url(#brass)" />
  </g>

  <!-- Guest Leather Ledger -->
  <rect x="260" y="405" width="120" height="35" rx="3" fill="#3b2b20" stroke="rgba(184,151,88,0.3)" stroke-width="1" />
  <line x1="320" y1="405" x2="320" y2="440" stroke="url(#brass)" stroke-width="1" />

  <!-- Caption Plaque Overlay -->
  <g transform="translate(480, 560)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="rgba(12,38,34,0.85)" stroke="url(#brass)" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" fill="#f4f7f5" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" letter-spacing="1">RECEPTION &amp; BRASS KEY RACK</text>
  </g>
</svg>
