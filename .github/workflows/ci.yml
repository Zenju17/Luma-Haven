name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hims_test
          POSTGRES_PASSWORD: local-integration-only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hims_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hims_test:local-integration-only@127.0.0.1:55432/postgres
      E2E_DATABASE_URL: postgresql://hims_test:local-integration-only@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.lock
      - name: Check migrations and backend tests
        run: |
          .venv/bin/python backend/manage.py check
          .venv/bin/python backend/manage.py makemigrations --check --dry-run
          .venv/bin/python -m pytest -c backend/pytest.ini backend/tests -q
      - name: Install frontend dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Typecheck and build frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm run typecheck:e2e
          npm run build
      - name: Critical browser journey
        working-directory: frontend
        run: npm run test:e2e

  audit:
    # Dependency vulnerability scan. Non-blocking at first so a new advisory cannot stop unrelated work;
    # review the output weekly and fix or document each finding (see docs/SECURITY.md).
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python dependencies (pip-audit)
        run: pip install pip-audit && pip-audit -r backend/requirements.lock --strict
      - name: Frontend dependencies (npm audit)
        working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=high

  deploy-config:
    # Proves the production configuration still boots and the production images still build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose file
        run: |
          cp .env.production.example .env.production
          SITE_ADDRESS=hotel.example.com ACME_EMAIL=ops@example.com docker compose -f compose.prod.yaml --env-file .env.production config -q
      - name: Shell script syntax
        run: sh -n scripts/backup_db.sh && sh -n scripts/restore_drill.sh
      - name: Build production images
        # Not yet exercised in CI; remove continue-on-error after the first green run.
        continue-on-error: true
        run: |
          docker build -f backend/Dockerfile.prod -t luma-backend:ci backend
          docker build -f deploy/web/Dockerfile -t luma-web:ci .

