# Production topology. Usage: docker compose -f compose.prod.yaml --env-file .env.production up -d --build
# The database is external (managed PostgreSQL); see docs/INFRASTRUCTURE.md.
name: luma-haven

x-backend: &backend
  image: luma-haven-backend:latest
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  env_file: .env.production
  environment:
    APP_ENV: production
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: [redis_data:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    <<: *backend
    volumes:
      - media:/app/media
      - backups:/backups:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backup:
    image: docker.io/library/postgres:17-alpine
    entrypoint: ["/bin/sh", "-c", "while true; do /scripts/backup_db.sh || true; sleep 86400; done"]
    env_file: .env.production
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    restart: unless-stopped

volumes:
  media:
  backups:
  redis_data:
  caddy_data:
  caddy_config:
